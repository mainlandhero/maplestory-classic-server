[package]
name = "launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MapleCW launcher: sign in, stake the login claim, patch the client, start the game."

[dependencies]
store = { path = "../store" }
patchset = { path = "../patchset" }
# The pin, shared with the sign-in service so both agree on what a fingerprint is.
tlspin = { path = "../tlspin" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"

[dev-dependencies]
# The real sign-in service, for the one end-to-end test that signs in over TLS with the pin.
auth = { path = "../auth" }

[lib]
name = "launcher"
path = "src/lib.rs"

[[bin]]
name = "maplecw-launcher"
path = "src/main.rs"
# No test harness for the binary. It is built with requireAdministrator embedded, and a
# harness compiled from this target inherits that manifest - `cargo test` then fails with
# "The requested operation requires elevation. (os error 740)" before running anything. The
# tests live in the library. See src/main.rs.
test = false
