[package]
name = "world"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The MapleCW game world: one server per channel, entered by migration from character select."

[dependencies]
net = { path = "../net" }
store = { path = "../store" }
# The live server's Discord status message - the hub only (`discordstatus`).
webhook = { path = "../webhook" }

[[bin]]
name = "maplecw-world"
path = "src/bin/world_server.rs"

[[bin]]
name = "maplecw-chat"
path = "src/bin/chat_server.rs"
